services:
  mnemosyne:
    build: .
    image: mnemosyne:local
    ports:
      - "3100:3100"
    env_file: .env
    environment:
      WHISPER_URL: http://host.docker.internal:8178
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
    volumes:
      - mnemosyne-data:/data
      - ${VAULT_HOST_PATH:?Set VAULT_HOST_PATH in .env to your Obsidian vault folder}:/vault
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 75s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3100/api/health').then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  mnemosyne-data:
