services:
  mnemosyne:
    build: .
    image: mnemosyne:local
    ports:
      - "127.0.0.1:3100:3100"
    env_file: .env
    environment:
      WHISPER_URL: http://host.docker.internal:8178
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      AGENT_URL: http://agent:8100
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STATUS_CHECK_INTERVAL_MINUTES: ${STATUS_CHECK_INTERVAL_MINUTES:-2}
      BACKUP_DIR: /backups
    volumes:
      - mnemosyne-data:/data
      - ${VAULTS_HOST_PATH:?Set VAULTS_HOST_PATH in .env to the folder that holds the vaults}:/vaults
      - ${BACKUP_HOST_PATH:?Set BACKUP_HOST_PATH in .env to your backups folder}:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 75s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3100/api/health').then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  agent:
    build: apps/agent
    image: mnemosyne-agent:local
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
      AGENT_SECRET: ${AGENT_SECRET:?Set AGENT_SECRET in .env}
      VAULTS_ROOT: /vaults
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${VAULTS_HOST_PATH:?Set VAULTS_HOST_PATH in .env to the folder that holds the vaults}:/vaults:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mnemosyne-data:
