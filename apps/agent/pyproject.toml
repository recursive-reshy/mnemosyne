[project]
name = "mnemosyne-agent"
version = "0.9.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "naresh", email = "reshs92.09@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.159.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [ "E4", "E7", "E9", "F", "B", "UP", "N", "SIM" ]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = [ "src", "tests" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
markers = [ "docker: needs a Docker daemon" ]
addopts = "-m 'not docker'"
